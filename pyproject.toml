[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escalationbench"
version = "0.1.0"
description = "Does business pressure make LLM support agents miss human escalations or misreport their actions?"
requires-python = ">=3.12"

[project.scripts]
ebench = "escalationbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
